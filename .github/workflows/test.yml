name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      MISE_EXPERIMENTAL: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v4
        with:
          install: true
          cache: true
      - run: git config --global user.name ci && git config --global user.email ci@example.invalid
      - run: mise run test
      - run: git diff --check
  install:
    runs-on: ubuntu-latest
    container: debian:stable-slim
    env:
      GITHUB_TOKEN: ${{ github.token }}
      MISE_JOBS: "1"
      SHIV_NONINTERACTIVE: "1"
    steps:
      - run: apt-get update -q && apt-get install -y -q --no-install-recommends bash git curl jq ca-certificates
      - uses: actions/checkout@v6
      - run: git config --global user.name ci && git config --global user.email ci@example.invalid
      - run: curl -fsSL shiv.knacklabs.co/install.sh | bash
      - run: |
          export PATH="$HOME/.local/bin:$PATH"
          shiv install lab "$GITHUB_WORKSPACE"
          lab --version
          lab version
          [ "$(lab --version | awk '{ sub(/\*$/, "", $2); print $2 }')" = "$(lab version)" ]
          lab init t --at /tmp/t --owner x
          lab doctor --lab /tmp/t
