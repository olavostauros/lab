[settings]
quiet = true
task_output = "interleave"
experimental = true
aqua.registries = ["https://github.com/KnickKnackLabs/bats-core"]

[env]
LAB_NAME = "lab"
LAB_PROJECT = "lab"
LAB_DIR = "{{ config_root }}"
WORK_DIR = "{{ config_root }}"
LAB_AUTHOR_DOMAIN = "lab.invalid"
# The owner's GitHub email (the noreply address works): agent-env stamps it,
# so commits link to that account under each agent's name; empty keeps the label.
LAB_GH_EMAIL = ""

[task_config]
includes = [".agents/tasks", ".mise/tasks"]

[plugins]
shiv = "https://github.com/KnickKnackLabs/vfox-shiv"

[tools]
"aqua:KnickKnackLabs/bats-core" = "1.14.0-kkl.3"
"aqua:shenwei356/rush" = "0.9.0"
gum = "0.17.0"
"shiv:codebase" = "0.5"
"shiv:notes" = "0.10"
"shiv:readme" = "0.3"
"shiv:rudi" = "0.5.4"

[_.codebase]
name = "lab"
lint = ["@all"]
# This tested aggregate owns lint; Codebase checks the CI call, not task internals.
ci_lint_gate = "mise run validate --verbose"
